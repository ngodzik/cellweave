# The traced sheet of epithelium-traced.toml with crowding made the main
# reason a cell leaves (networks/epithelium-crowded.toml).
#
# Its cells divide about every 110 steps rather than 97, so the run is longer,
# to reach six months of a mouse's life once each run's step is calibrated on
# its own division rate (chapter 24).

width = 200
height = 200
mcs = 11000
temperature = 10.0
snapshot_interval = 1000
output_dir = "output-epithelium-crowded-traced"
oxygen_uptake = 0.0
network = "networks/epithelium-crowded.toml"
hours_per_step = 0.6

[seeding]
kind = "sheet"
side = 10

[tracing]
at = 1000
every = 10
