# cord-angiogenic.toml, with blood only through loops (chapter 14).
#
# A sprout carries no blood, and supplies no oxygen, until its tip has joined
# another vessel; then it carries blood, and so does everything it grew from
# and everything the vessel it joined grew from. Everything else is
# cord-angiogenic.toml.

width = 300
height = 300
mcs = 1500
temperature = 10.0
snapshot_interval = 100
output_dir = "output-cord-angiogenic-joining"
oxygen_uptake = 0.00002  # calibrated on measured melanoma spheroids (chapter 25)
network = "networks/ras-erk.toml"

[oxygen_source]
kind = "vessel"
radius = 6

[angiogenesis]
threshold = 0.5
speed = 1.0
reach = 30.0
perfusion = "on_joining"
