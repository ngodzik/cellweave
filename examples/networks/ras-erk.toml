# The RAS/ERK/HIF-1a network, as a file.
#
# This is the network the program used to hold as literals in its source. It is
# here so that the built-in hypothesis and one you write go through exactly the
# same path, and so that this one can be read, argued with, and copied.
#
# The chain: EGF, a growth factor outside the cell, switches on RAS, a protein
# that works as an on/off switch; RAS switches on ERK, whose level tells the cell
# how large to grow. Separately, HIF-1a accumulates as oxygen falls and is the
# cell's hypoxia response; it drives VEGF, the call for new blood vessels, which
# currently goes nowhere. BCL2 is survival: fed by ERK and HIF-1a, held near a
# set point, and damaged below the anoxia threshold by something no amount of
# pro-survival signalling offsets.
#
# Every rate is a plausible value, not a measured one. What they do fix, and what
# tests pin: ERK saturates near 0.55, the network settles in about fifteen units
# of its own time, and survival collapses between 5 and 6 percent of the source's
# oxygen while staying intact above 10 percent.

[[nodes]]
name = "ras"
initial = 0.05
terms = [
  { kind = "activated_by", source = "egf", rate = 0.5 },
  { kind = "decays", rate = 0.3 },
]

[[nodes]]
name = "erk"
initial = 0.05
terms = [
  { kind = "activated_by", source = "ras", rate = 0.8 },
  { kind = "decays", rate = 0.4 },
]

[[nodes]]
name = "hif1"
initial = 0.05
terms = [
  { kind = "activated_by_absence_of", source = "oxygen", rate = 0.6 },
  { kind = "decays", rate = 0.5 },
]

[[nodes]]
name = "vegf"
initial = 0.05
terms = [
  { kind = "produced_by", source = "hif1", rate = 0.7 },
  { kind = "decays", rate = 0.3 },
]

[[nodes]]
name = "bcl2"
initial = 0.70
terms = [
  { kind = "produced_by", source = "erk", rate = 0.2 },
  { kind = "produced_by", source = "hif1", rate = 0.1 },
  { kind = "relaxes_to", value = 0.5, rate = 0.15 },
  # Necrosis. Below fifteen percent of the source's oxygen the cell cannot make
  # enough energy, and this is the one term nothing above cancels.
  { kind = "damaged_below", source = "oxygen", threshold = 0.15, rate = 0.25 },
]

# Which node answers which question the simulation asks of a cell.
[roles]
growth = "erk"
survival = "bcl2"
hypoxia_response = "hif1"

# How the growth node becomes a demand on the lattice.
#
# The coefficient matters more than it looks: ERK saturates near 0.55, so a
# coefficient of 0.5 would cap the target below any reachable division threshold
# and no cell would ever divide. This one aims a well stimulated cell at roughly
# twice its reference size.
[mechanics]
growth_coefficient = 1.5
lambda_volume = 50.0
j_medium = 16.0
j_self_base = 2.0
j_self_from_growth = 8.0
