# The RAS/ERK network, in a cell of normal epithelium that can differentiate.
#
# Everything comes from ras-erk.toml, plus one node: NOTCH, the receptor that in
# the lining of the oesophagus and the skin pushes a basal cell to stop dividing
# and differentiate. Its level is read as the cell's chance, per lattice step,
# of committing to differentiate and leaving the basal layer.
#
# Two things raise it. Crowding, above all: a cell squeezed below the size it
# was born to differentiates readily, half way at 75% of that size, and a
# daughter is born at about 70%, so it is often a newborn that leaves, one
# of two sisters, and a division that ends with one daughter gone leaves its
# clone the size it was. And a small constant level, so that a cell with
# room around it still leaves now and then. Together they hold the layer at a
# steady density with nothing counting cells.
#
# Set against the clones Piedrafita and colleagues counted in the mouse
# oesophagus (chapter 24): this is the setting, of those tried, whose clones
# come nearest the mouse's at every time measured, a third larger at 10 and
# 30 days. Before that chapter the baseline was five times stronger and
# crowding ten times weaker, half way at 60%, and the clones grew about six
# times too fast per division. Crowding stronger than this empties the layer.

extends = "ras-erk.toml"

[[nodes]]
name = "notch"
initial = 0.01
terms = [
  # The baseline: pulled towards full on, very slowly, and decaying fast.
  # Both rates set the level, so a mutation that slows the first or speeds
  # the second turns NOTCH down, as a loss of NOTCH1 does in the oesophagus.
  { kind = "relaxes_to", value = 1.0, rate = 0.001 },
  { kind = "decays", rate = 0.5 },
  # Crowding: half way at a cell squeezed to 75% of its reference size.
  { kind = "activated_by", source = "crowding", rate = 0.3, hill = { n = 4.0, k = 0.25 } },
]

[roles]
growth = "erk"
survival = "bcl2"
hypoxia_response = "hif1"
differentiation = "notch"
