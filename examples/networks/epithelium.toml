# The RAS/ERK network, in a cell of normal epithelium that can differentiate.
#
# Everything comes from ras-erk.toml, plus one node: NOTCH, the receptor that in
# the lining of the oesophagus and the skin pushes a basal cell to stop dividing
# and differentiate. Its level is read as the cell's chance, per lattice step,
# of committing to differentiate and leaving the basal layer.
#
# Two things raise it. A small constant level, so that cells leave the layer at
# a steady rate even with room around them, which is what keeps an epithelium
# turning over. And crowding: a cell squeezed below the size it was born to
# differentiates more readily, which is how a crowded patch thins itself out.
# Together they hold the layer at a steady density with nothing counting cells.
#
# Every rate is a placeholder chosen so that the layer turns over in a few
# hundred steps on a 200 pixel grid.

extends = "ras-erk.toml"

[[nodes]]
name = "notch"
initial = 0.01
terms = [
  # The baseline: pulled towards full on, slowly, and decaying fast, so that it
  # settles near 0.01 and about one cell in a hundred commits each step. Both
  # rates set the level, so a mutation that slows the first or speeds the
  # second turns NOTCH down, as a loss of NOTCH1 does in the oesophagus.
  { kind = "relaxes_to", value = 1.0, rate = 0.005 },
  { kind = "decays", rate = 0.5 },
  # Crowding: half way at a cell squeezed to 60% of its reference size.
  { kind = "activated_by", source = "crowding", rate = 0.03, hill = { n = 4.0, k = 0.4 } },
]

[roles]
growth = "erk"
survival = "bcl2"
hypoxia_response = "hif1"
differentiation = "notch"
