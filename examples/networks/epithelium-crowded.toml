# The epithelium network with crowding made the main reason a cell leaves.
#
# Everything comes from epithelium.toml except NOTCH: its baseline, the pull
# that makes a cell leave with room around it, is a fifth of what it is there,
# and crowding raises it ten times as fast and half way at a cell squeezed to
# 75% of its reference size rather than 60%. A daughter is born at about 70%,
# so it is the newborn that leaves, often one of the two sisters, and a
# division that ends with one daughter gone leaves its clone the size it was.
#
# The best of the settings chapter 24 tried against the clones of the mouse
# oesophagus. A rate of 1 or 3, or a half way point at 85%, empties the layer.

extends = "epithelium.toml"

[[nodes]]
name = "notch"
initial = 0.01
terms = [
  { kind = "relaxes_to", value = 1.0, rate = 0.001 },
  { kind = "decays", rate = 0.5 },
  { kind = "activated_by", source = "crowding", rate = 0.3, hill = { n = 4.0, k = 0.25 } },
]
