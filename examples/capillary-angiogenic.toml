# capillary.toml, with vessels that may grow from the capillary (chapter 18).
#
# At the cord's threshold of 0.5 no wall of the capillary ever sprouts: the
# call of cells starving along a layer arrives too diluted. The threshold
# here is 0.3, a placeholder like the cord's. Blood flows through a new
# vessel at once. Everything else is capillary.toml.

width = 300
height = 300
mcs = 1500
temperature = 10.0
snapshot_interval = 100
output_dir = "output-capillary-angiogenic"
oxygen_uptake = 0.0001
network = "networks/ras-erk.toml"

[oxygen_source]
kind = "capillary"
radius = 3

[angiogenesis]
threshold = 0.3
speed = 1.0
reach = 30.0
