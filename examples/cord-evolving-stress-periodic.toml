# The evolving cord of chapter 6, exposed to the lethal stress of chapter 8
# from step 800, for 150 steps in every 500.
#
# Daughters mutate one division in twenty, and some mutations change how a
# cell responds to the stress: p53 raised less, caspase switched on less
# sharply. Nothing says which. Paired with cord-evolving-stress.toml,
# which differs by its schedule alone, under the same seeds: the two are the
# same history up to step 800.
#
#   ./target/release/cellweave --config examples/cord-evolving-stress.toml \
#       --versus examples/cord-evolving-stress-periodic.toml --seeds 1-20

width = 200
height = 200
mcs = 3000
temperature = 10.0
snapshot_interval = 50
output_dir = "output-cord-evolving-stress-periodic"
oxygen_uptake = 0.00003
mutation_rate = 0.05
network = "networks/stress-response.toml"

[oxygen_source]
kind = "vessel"
radius = 6

[exposure]
intensity = 1.0
uptake = 0.0001
start = 800
schedule = { kind = "periodic", on = 150, off = 350 }
