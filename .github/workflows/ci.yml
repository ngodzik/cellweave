name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push replaces the run it supersedes instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. Nothing here needs write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody reads is a warning that does not exist.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format, lints and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features

      # CLAUDE.md requires a doc-comment on every public item. This is what
      # checks that the promise is kept, and it catches broken intra-doc links
      # at the same time.
      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # The course in docs/ names symbols in the code. A rename that leaves the
      # chapter behind is the most common way a course drifts from its program.
      - name: The course still matches the code
        run: python3 scripts/check-course-symbols.py

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --all-features

  msrv:
    name: Oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The ref is the toolchain: this installs Rust 1.97. Keep it in step with
      # rust-version in Cargo.toml, which is the value that binds; the README
      # tells people which toolchain they need, and this is what makes that
      # sentence true. Dependabot is told to leave it alone in dependabot.yml.
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2

      # The ref above and rust-version state the same fact in two places, and two
      # places drift. This makes them disagree loudly instead of leaving the job
      # quietly testing a toolchain nobody promised.
      - name: The toolchain is the one the manifest promises
        run: |
          declared=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1 | cut -d. -f1,2)
          installed=$(rustc --version | cut -d' ' -f2 | cut -d. -f1,2)
          echo "Cargo.toml says $declared, this runner has $installed"
          if [ -z "$declared" ]; then
            echo "::error::no rust-version found in Cargo.toml"
            exit 1
          fi
          if [ "$declared" != "$installed" ]; then
            echo "::error::Cargo.toml promises Rust $declared but CI installed $installed"
            exit 1
          fi

      - name: Build
        run: cargo check --workspace --all-targets --all-features

  viewer:
    name: Viewer builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: viewer

      # What winit links against to open a window on Linux.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwayland-dev libxkbcommon-dev

      # A workspace of its own, so none of the jobs above see it: the
      # simulator is checked without a graphics stack, and this is the one
      # place that pays for Bevy.
      - name: Formatting
        run: cargo fmt --manifest-path viewer/Cargo.toml -- --check

      - name: Lints
        run: cargo clippy --manifest-path viewer/Cargo.toml --all-targets

  determinism:
    name: Same seed, same run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A simulation whose output moves between two runs of the same seed
      # cannot be argued with, because no result can be attributed to the
      # change that was made rather than to the noise. This is the one property
      # the compiler cannot check and the whole method rests on.
      # 500 steps is past the point where the tissue reaches the edge of the
      # default grid, so this also checks that the early stop lands on the same
      # step both times. The cord is cut short: it never stops on its own.
      # The first run of each pair is held to one thread and the second gets
      # every core the runner has, so the comparison also checks that the
      # parallel field solve gives the same answer whatever the thread count.
      - name: Run each scenario twice
        run: |
          cargo build --release
          RAYON_NUM_THREADS=1 ./target/release/cellweave --config examples/spheroid.toml
          mv output spheroid-a
          ./target/release/cellweave --config examples/spheroid.toml
          mv output spheroid-b
          RAYON_NUM_THREADS=1 ./target/release/cellweave --config examples/cord.toml --mcs 400
          mv output-cord cord-a
          ./target/release/cellweave --config examples/cord.toml --mcs 400
          mv output-cord cord-b
          ./target/release/cellweave --config examples/cord-mutant.toml --mcs 200

      - name: Compare the runs
        run: |
          diff --recursive spheroid-a spheroid-b
          diff --recursive cord-a cord-b
          # The mutant only has to run: it is here so that a network file with a
          # different topology is exercised, not just the built-in one.
          test -s output-cord-mutant/snapshot_000000.json
