version: 2

updates:
  # Security fixes arrive as dependency bumps, so an unattended project needs
  # something that opens the pull request on its own.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The viewer has a lock file of its own, and Bevy moves often.
  - package-ecosystem: cargo
    directory: "/viewer"
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # egui_plot has to draw with the egui that bevy_egui hands it, and each
      # of its minor releases moves to the next egui. Raised on its own, it
      # brings a second egui whose colours and widgets the first refuses, and
      # the viewer stops compiling (#30). Its patch releases still come. Raise
      # its minor version by hand, in the same change as the bevy_egui release
      # that moves to the same egui.
      - dependency-name: egui_plot
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The actions in the workflows are dependencies too, and the ones that go
  # stale quietly are the ones nobody thinks of.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Europe/Paris
    ignore:
      # The branches of this action are toolchain names, not releases: @stable
      # installs stable and @1.97 installs 1.97. Dependabot reads the second as
      # a version and offers to raise it, which would quietly stop the job from
      # testing the minimum toolchain the README promises. The version that
      # matters lives in rust-version in Cargo.toml.
      - dependency-name: dtolnay/rust-toolchain
