# Configuration for cargo-deny, run by .github/workflows/security.yml.
#
# Three questions, none of which the compiler answers: is a dependency subject
# to a published advisory, is its licence compatible with shipping this under
# MIT, and did it come from somewhere other than crates.io.

[advisories]
version = 2
# Nothing is ignored. An entry here is a decision to live with a known
# vulnerability, and it should carry the advisory identifier and the reason.
ignore = []

[licenses]
version = 2
# Derived from the dependency tree as it actually stands, not from a template.
# A new licence appearing here is a fact worth being told about.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A dependency pinned to "*" takes whatever version the registry happens to hold,
# which is a supply chain risk worth refusing.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
